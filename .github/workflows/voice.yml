name: הקלטת קול למשחק
# Runs by itself whenever game.html or make_voice.py changes:
# records every sentence in natural Hebrew and publishes index.html with the voice inside.
on:
  push:
    branches: [main]
    paths: [game.html, make_voice.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python make_voice.py game.html
      - run: mv game-voice.html index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add recorded voice to the game" || echo "no change"
          git push
